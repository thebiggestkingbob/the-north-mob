 and the operations that connect it all.", "image": 2}, {"tag": "THE OFFERING", "title": "FIVE PILLARS.", "lead": "One connected ecosystem.", "body": "Digital headquarters & marketing\nMerchandise & commerce\nDocumenting the journey\nJoin the Mob community\nSignature live experiences", "image": 3}, {"tag": "DIGITAL HOME", "title": "ONE MOB. ONE HOME.", "lead": "The official destination for everything North Mob.", "body": "Music, visuals, merchandise, community access and event ticketing in one experience. Social media creates discovery; the website creates a relationship North Mob can maintain. We build, maintain and measure the platform together.", "image": 4, "link": true}, {"tag": "MERCHANDISE", "title": "CULTURE YOU CAN WEAR.", "lead": "Three new products each quarter.", "body": "Seed exclusive prototypes with the group, crew, H4B collaborators and selected cultural voices before the public drop. Let the garments appear naturally in music videos, gigs and MOB VLOGS. Open a website wishlist and size-registration journey, then manufacture against real demand. Keep collectible objects available alongside quarterly apparel drops. North Mob approves creative; budgets and profit shares are agreed per drop.", "image": 5}, {"tag": "THE STRATEGY / ACTIVATION", "title": "SEED THE CULTURE.", "lead": "Visibility before the first sale.", "body": "Exclusive pieces first go to the artists, rollout crew, selected H4B collaborators and cultural connectors. Each video, appearance and behind-the-scenes episode creates familiarity with the merchandise. The website captures product likes, sizes and demand signals before stock is committed. This turns the rollout into a coordinated campaign—not a disconnected shop launch.", "image": 3}, {"tag": "MERCH / LIVE SCENARIO", "title": "MERCH POTENTIAL.", "kind": "merch", "image": 6}, {"tag": "SUPA MOB FANS", "title": "BUILD THE BUNDLES.", "lead": "Give superfans more ways to participate.", "body": "Curate six merchandise combinations across illustrative R1,000–R2,500 price points: apparel, headwear, socks, totes, key tags and stickers. Keep individual items available. Bundle discounts must be tested against actual production costs, not invented margins. Use fan interest and purchase data to decide which combinations deserve production.", "image": 6}, {"tag": "MEDIA & DOCUMENTATION", "title": "MOB VLOGS.", "lead": "Document the movement. Build an archive as it happens.", "body": "Capture the studio, rehearsals, travel, backstage, school and campus activations, collaborations and the work behind each release. Publish short cuts through social channels, with longer episodes and exclusives on the North Mob platform. MOB VLOGS is a documentation engine—not creative control over music videos. Production access, equipment, ownership and distribution rights are agreed upfront.", "image": 7}, {"tag": "JOIN THE MOB", "title": "BUILD THE INNER CIRCLE.", "lead": "Free-first in 2027. Paid only when the value is real.", "body": "Start with a free community, early access to drops, wishlist updates, exclusive behind-the-scenes footage and first notice of live experiences. Build a direct, permission-based relationship with fans before introducing a paid tier. A premium membership in 2028 is an option only if the ongoing content and access justify it.", "image": 8}, {"tag": "MEMBERSHIP / LIVE SCENARIO", "title": "MEMBERSHIP POTENTIAL.", "kind": "members", "image": 9}, {"tag": "SIGNATURE EVENT", "title": "MOBTIE$.", "lead": "Turn the culture into an experience fans can attend.", "body": "Build a recurring North Mob-owned event format, with March, August and November as proposed annual moments to test and refine. Integrate R100 ticket scenarios, merchandise, food and drink opportunities, community access and documentary coverage. Attendance targets and event economics remain illustrative until venue, production, staffing and operating budgets are approved.", "image": 10}, {"tag": "THE ACTIVATION / EXPERIENCE", "title": "EVERY APPEARANCE COUNTS.", "lead": "Culture → commerce → community.", "body": "A music video introduces the look. A live show makes it visible. A vlog deepens the story. The website turns interest into a wishlist, registration, product purchase or ticket. The next event brings fans together—and generates the next chapter of content. This is the system THE BIGGEST proposes to build with North Mob.", "image": 10}, {"tag": "EVENT / LIVE SCENARIO", "title": "EVENT POTENTIAL.", "kind": "event", "image": 11}, {"tag": "SUPA MOB FANS / LIVE SCENARIO", "title": "THE BUNDLE ECONOMY.", "kind": "supa", "image": 12}, {"tag": "THE OPPORTUNITY / SCENARIO LAB", "title": "THE BIG PICTURE.", "kind": "lab", "image": 12}, {"tag": "THE BIGGEST / OUR VALUE", "title": "MORE THAN A PARTNER.", "lead": "THE BIGGEST turns North Mob’s cultural momentum into a connected business ecosystem.", "body": "We bring the original strategy, creative commercial thinking and the team to put it into motion. We design and operate the digital home, turn merchandise ideas into manufactured products and sellable drops, build direct fan relationships through Join the Mob, and document the moments that make the movement worth following. We connect content, commerce, community and MOBTIE$ experiences so each activity strengthens the next.\n\nNorth Mob brings the music, identity and audience. THE BIGGEST brings the strategy, execution, partnerships, operational coordination and accountability to help those assets grow into sustainable opportunities—without taking control of the art.", "image": 12}, {"tag": "PARTNERSHIP MODEL", "title": "SHARED UPSIDE.", "lead": "Clear boundaries. Transparent numbers.", "body": "North Mob retains its music, image, independent performances and creative control. THE BIGGEST originates and coordinates the commercial strategy, the platform, manufacturing partnerships, media documentation and event planning. Website setup and maintenance, merchandise profit splits, project budgets, rights, reporting and exit terms must be agreed before activation. No automatic claim on existing income.", "image": 13}, {"tag": "THE ROADMAP", "title": "2027: BUILD. 2028: SCALE.", "lead": "Prove the model before expanding it.", "body": "NOV–DEC 2026 — Seed prototypes, capture content, showcase the catalogue, collect wishlist interest and launch a controlled first apparel drop.\nJAN–FEB 2027 — Visit schools and campuses with permission, document activations and roll out demand-led products.\nMAR 2027 — Aim to activate the full catalogue and pilot the first MOBTIE$ experience.\n2027–2028 — Repeat proven merchandise drops, grow MOB VLOGS and Join the Mob, and expand events when demand and budgets justify it.", "image": 14}, {"tag": "NEXT ACTIONS", "title": "ALIGN. SIGN. ACTIVATE.", "lead": "A partnership we can both commit to.", "body": "Agree the scope and decision makers. Confirm setup and hosting fees. Negotiate commercial splits and content rights. Approve the first three products. Agree the exit framework. Then sign, activate and launch.", "image": 15}, {"tag": "THE NORTH MOB", "title": "LET’S BUILD WHAT’S NEXT.", "lead": "We’re not proposing to take a percentage of North Mob’s career.", "body": "We’re proposing to share in the value of the commercial opportunities we build together.", "image": 14, "closing": true}],PHOTOS=["/documents/assets/a05a9909308edcd0de96.webp", "/documents/assets/6ff1fb537075c9ff676a.webp", "/documents/assets/c4c00d0937505095df47.webp", "/documents/assets/d186210bedf91f6b9391.webp", "/documents/assets/5775147dde74bac63cdc.webp", "/documents/assets/d7a9a1345431d436f592.webp", "/documents/assets/454b52aae6e96a7878cc.webp", "/documents/assets/f531ad7278676cea7841.webp", "/documents/assets/25cca4329fa211c92b25.webp", "/documents/assets/c6fd2715b9f8f93d9a58.webp", "/documents/assets/9a288727dde9a35150ba.webp", "/documents/assets/237bd574db29b5c1260b.webp", "/documents/assets/ff7dd180d43424e886a8.webp", "/documents/assets/3e5cb611d43407550cb7.we function calc(type){
if(type==='merch')return `<div class="number" id="merchTotal">R420k</div><div class="unit">ILLUSTRATIVE ANNUAL GROSS MERCH SALES</div><div class="controls">${slider('products','PRODUCTS / YEAR',3,24,3,12)}${slider('units','UNITS / PRODUCT',100,1000,50,100)}${slider('price','AVERAGE PRICE',150,1000,25,350)}</div><div class="kpis"><div class="kpi"><b id="merchUnits">1,200</b><span>UNITS SOLD</span></div><div class="kpi"><b id="merchNet">R168k</b><span>CONTRIBUTION AFTER ASSUMED DIRECT COSTS</span></div></div><div class="note">Illustration only. Contribution assumes 60% direct costs, before further overhead, taxes or partner distributions.</div>`;
if(type==='members')return `<div class="number" id="memberTotal">R50k</div><div class="unit">GROSS MONTHLY MEMBERSHIP REVENUE</div><div class="controls">${slider('paid','PAYING MEMBERS',50,2000,50,1000)}${slider('monthly','MONTHLY FEE',20,150,5,50)}</div><div class="kpis"><div class="kpi"><b id="memberYear">R600k</b><span>ANNUALISED AT THIS RUN RATE</span></div><div class="kpi"><b id="memberNet">R42.5k</b><span>MONTHLY AFTER ASSUMED SERVICE COSTS</span></div></div><div class="note">Annualised run rate is not total 2028 revenue. Assumes R7.50 per member/month in variable servicing costs, excluding other costs, taxes and churn.</div>`;
if(type==='event')return `<div class="number" id="eventTotal">R80k</div><div class="unit">POTENTIAL GROSS EVENT SALES SCENARIO</div><div class="controls">${slider('attendees','ATTENDEES',100,1000,50,200)}${slider('ticket','TICKET PRICE',50,500,25,100)}${slider('spend','EXTRA SPEND / PERSON',0,750,25,300)}</div><div class="kpis"><div class="kpi"><b id="eventTickets">R20k</b><span>TICKETS</span></div><div class="kpi"><b id="eventExtra">R60k</b><span>ADDITIONAL CUSTOMER SPEND</span></div></div><div class="note">Illustrative gross transactions only. Venue, security, staffing, production, stock, artist and other costs are excluded. Additional spending is only North Mob revenue if it is retained by the event; third-party vendor sales are not automatically included.</div>`;
if(type==='supa')return `<div class="number" id="supaTotal">R1.5m</div><div class="unit">SUPA MOB FANS · BUNDLE SALES / YEAR</div><div class="controls">${slider('supaCustomers','BUNDLE CUSTOMERS',100,3000,50,1000)}${slider('supaCart','AVERAGE BUNDLE CART',1000,2500,50,1500)}${slider('supaCost','BUNDLE DIRECT COST %',20,85,5,40)}</div><div class="kpis"><div class="kpi"><b id="supaNet">R900k</b><span>CONTRIBUTION AFTER DIRECT COSTS</span></div><div class="kpi"><b id="supa5">R0</b><span>5-YEAR GROSS AT 20% CUSTOMER GROWTH</span></div></div><div class="note">Curated bundles are a distinct merchandise channel. Exclude bundle units from regular merchandise sales to prevent double-counting. Customer growth is an illustrative assumption, not a forecast.</div>`;
if(type==='lab')return `<div class="lab-summary"><div><div class="number" id="allTotal">R0</div><div class="unit">COMBINED ILLUSTRATIVE GROSS OPPORTUNITY</div></div><div><div class="number smaller" id="labContribution">R0</div><div class="unit">CONTRIBUTION AFTER ASSUMED DIRECT COSTS</div></div></div><div class="lab-grid five">
<div class="lab-card"><div class="lab-card-title">01 / REGULAR MERCH</div><div class="kpi"><b id="labMerch">R420k</b><span>ANNUAL SALES</span></div><div class="controls">${slider('products','PRODUCTS / YEAR',3,24,3,12)}${slider('units','UNITS PER PRODUCT',100,1000,50,100)}${slider('price','AVERAGE PRICE',150,1000,25,350)}</div></div>
<div class="lab-card"><div class="lab-card-title">02 / SUPA MOB FANS</div><div class="kpi"><b id="labSupa">R1.5m</b><span>ANNUAL BUNDLE SALES</span></div><div class="controls">${slider('supaCustomers','BUNDLE CUSTOMERS',100,3000,50,1000)}${slider('supaCart','AVERAGE CART',1000,2500,50,1500)}</div></div>
<div class="lab-card"><div class="lab-card-title">03 / JOIN THE MOB</div><div class="kpi"><b id="labMember">R600k</b><span>ANNUALISED MEMBERSHIP</span></div><div class="controls">${slider('paid','PAYING MEMBERS',50,2000,50,1000)}${slider('monthly','MONTHLY FEE',20,150,5,50)}</div></div>
<div class="lab-card"><div class="lab-card-title">04 / MOBTIE$ EVENT</div><div class="kpi"><b id="labEvent">R80k</b><span>ONE EVENT</span></div><div class="controls">${slider('attendees','ATTENDEES',100,1000,50,200)}${slider('ticket','TICKET PRICE',50,500,25,100)}${slider('spend','EXTRA SPEND',0,750,25,300)}</div></div>
<div class="lab-card"><div class="lab-card-title">05 / COST ASSUMPTIONS</div><div class="kpi"><b id="labDirectCosts">R0</b><span>DIRECT COSTS / TOTAL</span></div><div class="controls">${slider('merchCost','REGULAR MERCH COST %',20,90,5,60)}${slider('supaCost','SUPA BUNDLE COST %',20,85,5,40)}${slider('eventCost','EVENT COST %',20,90,5,50)}${slider('memberCost','MEMBERSHIP COST %',0,50,5,15)}</div></div>
</div><div class="note lab-note">Illustrative comparison only: annual regular merchandise + annual SUPA bundles + annualised membership run rate + one event. Not a single-year forecast. Direct-cost contribution excludes overhead, tax, fees and negotiated splits. Bundle customers must not also be counted as regular merchandise sales.</div>`;
return '';}
slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide '+(s.kind==='lab'?'lab':s.closing?'closing':i===0?'cover':'');const text=s.kind?calc(s.kind):`<div class="lead">${s.lead||''}</div><div class="body">${s.body||''}</div>${s.link?'<a class="site" href="https://the-north-mob.vercel.app/" target="_blank" rel="noopener">OPEN LIVE WEBSITE ↗</a>':''}`;el.innerHTML=`<div class="left"><div class="eyebrow">${s.tag}</div><h1>${s.title}</h1>${text}</div><div class="right"><img alt="North Mob crew photography" src="${photos[s.image%photos.length]}"></div>`;deck.appendChild(el)});
let current=0;
function refresh(){
const merch=state.products*state.units*state.price,mem=state.paid*state.monthly,evt=state.attendees*(state.ticket+state.spend),supa=state.supaCustomers*state.supaCart;
const set=(id,val)=>{document.querySelectorAll('[id="'+id+'"]').forEach(e=>e.textContent=val)};
set('merchTotal',compact(merch));set('merchUnits',(state.products*state.units).toLocaleString('en-ZA'));set('merchNet',compact(merch*.4));
set('memberTotal',compact(mem));set('memberYear',compact(mem*12));set('memberNet',compact(mem*.85));
set('eventTotal',compact(evt));set('eventTickets',compact(state.attendees*state.ticket));set('eventExtra',compact(state.attendees*state.spend));
set('supaTotal',compact(supa));set('supaNet',compact(supa*(1-state.supaCost/100)));set('supa5',compact(supa*(1+1.2+1.2**2+1.2**3+1.2**4)));set('labSupa',compact(supa));set('labMerch',compact(merch));set('labMember',compact(mem*12));set('labEvent',compact(evt));set('allTotal',compact(merch+supa+mem*12+evt));
const costs=merch*state.merchCost/100+supa*state.supaCost/100+mem*12*state.memberCost/100+evt*state.eventCost/100;set('labDirectCosts',compact(costs));set('labContribution',compact(merch+supa+mem*12+evt-costs));
document.querySelectorAll('.slide.active input[type=range]').forEach(input=>{input.value=state[input.id];const out=input.parentElement.querySelector('output');if(out)out.textContent=['price','monthly','ticket','spend','supaCart'].includes(input.id)?money(state[input.id]):input.id.endsWith('Cost')||input.id==='spendCapture'?state[input.id]+'%':state[input.id].toLocaleString('en-ZA')});
}
function show(){document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===current));document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / '+slides.length;document.getElementById('bar').style.width=((current+1)/slides.length*100)+'%';refresh()}
function step(d){current=Math.min(slides.length-1,Math.max(0,current+d));show()}
document.addEventListener('input',e=>{if(e.target.matches('input[type=range]')){state[e.target.id]=Number(e.target.value);refresh()}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'){step(1)}if(e.key==='ArrowLeft'){step(-1)}});
let tx=0;document.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(e.target.closest('input'))return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>90)step(d<0?1:-1)},{passive:true});
show();
</script></body></html>
